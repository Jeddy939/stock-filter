name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: moneymaker
          POSTGRES_PASSWORD: moneymaker
          POSTGRES_DB: moneymaker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneymaker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cloud.txt pytest

      - name: Run tests
        env:
          MONEYMAKER_TEST_DATABASE_URL: postgresql://moneymaker:moneymaker@localhost:5432/moneymaker_test
        run: python -m pytest src/moneymaker/tests

  functions-build:
    name: Firebase Functions build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci

      - name: Build Functions
        run: npm run build
