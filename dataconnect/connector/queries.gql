query ListRecentScans($market: String!, $limit: Int!) @auth(level: USER, insecureReason: "Shared scan metadata is readable by every signed-in app user.") {
  scans: _select(
    sql: """
      SELECT id, source_id, created_at_utc, provider, query, scanned_count,
             result_count, skipped_no_history, config_json
      FROM scan_runs
      WHERE market = $1
      ORDER BY created_at_utc DESC
      LIMIT $2
    """,
    params: [$market, $limit]
  )
}

query GetScanResults($scanId: Int64!) @auth(level: USER) {
  results: _select(
    sql: """
      SELECT sr.id, sr.scan_id, sr.source_id, sr.rank, sr.ticker,
             sr.signal_date, sr.close_price, sr.market_cap, sr.avg_volume,
             sr.volume_ratio, sr.sector, sr.industry, sr.result_json,
             up.label, un.note AS personal_note, up.status AS personal_status,
             up.updated_at_utc AS appraised_at_utc
      FROM scan_results sr
      LEFT JOIN user_picks up
        ON up.scan_id = sr.scan_id
       AND up.source_id = sr.source_id
       AND up.ticker = sr.ticker
       AND up.firebase_uid = $2
      LEFT JOIN user_notes un
        ON un.scan_id = sr.scan_id
       AND un.source_id = sr.source_id
       AND un.ticker = sr.ticker
       AND un.firebase_uid = $2
      WHERE sr.scan_id = $1
      ORDER BY sr.rank ASC
    """,
    params: [$scanId, {_expr: "auth.uid"}]
  )
}

query GetChartBars($market: String!, $provider: String!, $ticker: String!, $startDate: Date!) @auth(level: USER, insecureReason: "Market candle data is shared read-only data for every signed-in app user.") {
  bars: _select(
    sql: """
      SELECT price_date, open_price, high_price, low_price, close_price, volume
      FROM price_history
      WHERE market = $1 AND provider = $2 AND ticker = $3 AND price_date >= $4
      ORDER BY price_date ASC
    """,
    params: [$market, $provider, $ticker, $startDate]
  )
}

query GetCompanyProfile($market: String!, $ticker: String!) @auth(level: USER, insecureReason: "Company profile data is shared read-only data for every signed-in app user.") {
  company: _selectFirst(
    sql: """
      SELECT market, ticker, info_json, fetched_at_utc
      FROM companies
      WHERE market = $1 AND ticker = $2
    """,
    params: [$market, $ticker]
  )
}

query GetMyAppraisals($scanId: Int64!) @auth(level: USER) {
  appraisals: _select(
    sql: """
      SELECT up.ticker, up.label, un.note, up.status, up.updated_at_utc AS appraised_at_utc
      FROM user_picks up
      LEFT JOIN user_notes un
        ON un.firebase_uid = up.firebase_uid
       AND un.scan_id = up.scan_id
       AND un.source_id = up.source_id
       AND un.ticker = up.ticker
      WHERE up.firebase_uid = $1 AND up.scan_id = $2
      ORDER BY ticker ASC
    """,
    params: [{_expr: "auth.uid"}, $scanId]
  )
}

query GetMySavedPicks($market: String, $limit: Int!) @auth(level: USER) {
  picks: _select(
    sql: """
      SELECT up.scan_id, up.source_id, up.market, up.ticker, up.label, up.status,
             up.created_at_utc, up.updated_at_utc, un.note,
             sr.rank, sr.signal_date, sr.close_price, sr.market_cap,
             sr.avg_volume, sr.volume_ratio, sr.sector, sr.industry, sr.result_json
      FROM user_picks up
      LEFT JOIN user_notes un
        ON un.firebase_uid = up.firebase_uid
       AND un.scan_id = up.scan_id
       AND un.source_id = up.source_id
       AND un.ticker = up.ticker
      LEFT JOIN scan_results sr
        ON sr.scan_id = up.scan_id
       AND sr.source_id = up.source_id
       AND sr.ticker = up.ticker
      WHERE up.firebase_uid = $1
        AND ($2::text IS NULL OR up.market = $2)
      ORDER BY up.updated_at_utc DESC
      LIMIT $3
    """,
    params: [{_expr: "auth.uid"}, $market, $limit]
  )
}

query GetMyRatingHistory($ticker: String, $limit: Int!) @auth(level: USER) {
  events: _select(
    sql: """
      SELECT id, event_at_utc, action, market, scan_id, ticker, label, note,
             rank, signal_date, close_price, market_cap, avg_volume,
             volume_ratio, sector, industry, yahoo_url
      FROM rating_events
      WHERE firebase_uid = $1
        AND ($2::text IS NULL OR ticker = $2)
      ORDER BY event_at_utc DESC
      LIMIT $3
    """,
    params: [{_expr: "auth.uid"}, $ticker, $limit]
  )
}

query GetMyNotes($market: String, $ticker: String, $limit: Int!) @auth(level: USER) {
  notes: _select(
    sql: """
      SELECT id, scan_id, source_id, market, ticker, note, created_at_utc, updated_at_utc
      FROM user_notes
      WHERE firebase_uid = $1
        AND ($2::text IS NULL OR market = $2)
        AND ($3::text IS NULL OR ticker = $3)
      ORDER BY updated_at_utc DESC
      LIMIT $4
    """,
    params: [{_expr: "auth.uid"}, $market, $ticker, $limit]
  )
}
